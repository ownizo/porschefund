<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <meta name="robots" content="noindex, nofollow">
    <title>Porsche Fund Admin</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#111; color:#eee; padding:2rem; max-width:500px; margin:0 auto; }
        input, button { width:100%; padding:0.8rem; margin:0.5rem 0; font-size:1rem; border-radius:6px; border:1px solid #333; background:#1a1a1a; color:#fff; }
        button { background:#d5001c; border:none; cursor:pointer; font-weight:700; }
        button:hover { background:#b80018; }
        .hidden { display:none; }
        .error { color:#f66; }
        h1 { color:#c9a227; }
    </style>
</head>
<body>
    <h1>Fund Admin</h1>
    <div id="admin">
        <p>Current raised (EUR): <strong id="current">0</strong></p>
        <label>New total amount (€):</label>
        <input type="number" id="amount" step="0.01" min="0">
        <button onclick="save()">Update Counter</button>
        <p style="margin-top:1rem;color:#888;font-size:0.85rem;">Saved in this browser, so the homepage here updates immediately. It does not change the public total for other people. That number lives in funds.json.</p>
        <p><a href="/" style="color:#c9a227;">← Back to homepage</a></p>
    </div>

    <script>
        const current = localStorage.getItem('porschefund_raised') || 0;
        document.getElementById('current').textContent = current;
        document.getElementById('amount').value = current;

        function save() {
            const val = parseFloat(document.getElementById('amount').value) || 0;
            localStorage.setItem('porschefund_raised', String(val));
            localStorage.setItem('porschefund_raised_at', String(Date.now()));
            document.getElementById('current').textContent = val;
            alert('Updated. Open the homepage in this browser and the counter will match.');
        }
    </script>
</body>
</html>
